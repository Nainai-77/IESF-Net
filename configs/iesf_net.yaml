# IESF-Net settings (Section 3.6.5 and Table A3).
# `defaults` is the validation-selected configuration reported in the paper;
# `search_space` is the predefined validation-only Optuna domain of Table A3.

defaults:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  d_model: 64                 # common width of every stream
  temporal_layers: 1          # layers of the numerical GRUs and of the text Transformers
  n_heads: 2                  # cross-attention: two 32-dimensional heads
  ff_dim: 128                 # feed-forward block of the temporal Transformers
  dropout: 0.1
  eta: 0.01                   # component-loss coefficient η of Eq. (17)
  half_life: 12.0             # initial memory half-life (observations) of every category
  pii_hidden: 16              # category GRU width (7 x 16 = 112 -> 64 projection)
  scale_emb_dim: 8            # scale embedding (64 + 64 + 8 = 136-dimensional context input)
  lookbacks: hybrid           # hybrid = (10, 30, 60, 90); uniform10 / uniform30 / uniform60 / uniform90
  residual_anchor: false      # manuscript Eq. (19) restores component levels; true = diagnostic last-value anchor

search_space:
  lr: [0.0001, 0.0003, 0.001]
  weight_decay: [0.0, 0.00001, 0.0001]
  batch_size: [32, 64]
  d_model: [64, 128]
  temporal_layers: [1, 2]
  n_heads: [2, 4]
  dropout: [0.0, 0.1, 0.2]
  eta: [0.0, 0.01, 0.1]
  half_life: [3.0, 12.0, 30.0]
  lookbacks: [uniform10, uniform30, uniform60, uniform90, hybrid]

lookback_presets:
  hybrid: [10, 30, 60, 90]
  uniform10: [10, 10, 10, 10]
  uniform30: [30, 30, 30, 30]
  uniform60: [60, 60, 60, 60]
  uniform90: [90, 90, 90, 90]
